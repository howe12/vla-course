<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1010" width="1000" height="1010">
  <defs>
    <marker id="a-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="a-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/></marker>
    <marker id="a-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/></marker>
    <marker id="a-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/></marker>
    <marker id="a-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
  </defs>
  <rect width="100%" height="100%" fill="#020617"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="500" y="30" fill="white" font-size="15" font-weight="700" text-anchor="middle" font-family="sans-serif">DM0.5 实机控制回路与时序 · LEO-Gemini</text>

  <!-- ============ Panel A: control loop ============ -->
  <text x="240" y="100" fill="#22d3ee" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">NUC / 小脑（采图 · 组包 · 安全 · 电机）</text>
  <text x="760" y="100" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle" font-family="sans-serif">云端 GPU 容器 / 大脑（HTTP · 推理）</text>
  <line x1="60" y1="112" x2="420" y2="112" stroke="#164e63" stroke-width="1"/>
  <line x1="580" y1="112" x2="940" y2="112" stroke="#4c1d95" stroke-width="1"/>

  <!-- L1 采集 -->
  <rect x="60" y="130" width="360" height="52" rx="7" fill="rgba(8,51,68,0.55)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="76" y="151" fill="white" font-size="11" font-weight="600" font-family="sans-serif">① 采集 3 路相机</text>
  <text x="76" y="168" fill="#94a3b8" font-size="8.5" font-family="sans-serif">video0=front · video4=left · video2=right ｜ JPEG Q85</text>

  <!-- L2 读 state -->
  <rect x="60" y="202" width="360" height="52" rx="7" fill="rgba(8,51,68,0.55)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="76" y="223" fill="white" font-size="11" font-weight="600" font-family="sans-serif">② 读 14 关节 state（闭环）</text>
  <text x="76" y="240" fill="#94a3b8" font-size="8.5" font-family="sans-serif">lerobot 后台缓存 ~3Hz，不是实时串口轮询</text>

  <!-- L3 组请求 -->
  <rect x="60" y="274" width="360" height="52" rx="7" fill="rgba(8,51,68,0.55)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="76" y="295" fill="white" font-size="11" font-weight="600" font-family="sans-serif">③ 组请求</text>
  <text x="76" y="312" fill="#94a3b8" font-size="8.5" font-family="sans-serif">3 × base64 JPEG + state ≈ 152KB（无时间戳字段）</text>

  <!-- C1 HTTP -->
  <rect x="580" y="274" width="360" height="52" rx="7" fill="rgba(46,16,101,0.5)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="596" y="295" fill="white" font-size="11" font-weight="600" font-family="sans-serif">④ HTTP 服务 :7891</text>
  <text x="596" y="312" fill="#94a3b8" font-size="8.5" font-family="sans-serif">POST /v1/infer ｜ 无状态：每轮都必须带 state</text>

  <!-- C2 模型 -->
  <rect x="580" y="346" width="360" height="52" rx="7" fill="rgba(46,16,101,0.5)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="596" y="367" fill="white" font-size="11" font-weight="600" font-family="sans-serif">⑤ DM0.5 LoRA 推理（checkpoint-500）</text>
  <text x="596" y="384" fill="#94a3b8" font-size="8.5" font-family="sans-serif">chunk = 50 步 × 14 维 ｜ 实测模型 242ms / 处理 260ms</text>

  <!-- C3 ActionAbsolute -->
  <rect x="580" y="418" width="360" height="52" rx="7" fill="rgba(46,16,101,0.5)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="596" y="439" fill="white" font-size="11" font-weight="600" font-family="sans-serif">⑥ ActionAbsolute（action_mode=RELATIVE）</text>
  <text x="596" y="456" fill="#94a3b8" font-size="8.5" font-family="sans-serif">服务端做 state + delta ｜ 夹爪维保持绝对值</text>

  <!-- L4 校验 -->
  <rect x="60" y="418" width="360" height="52" rx="7" fill="rgba(8,51,68,0.55)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="76" y="439" fill="white" font-size="11" font-weight="600" font-family="sans-serif">⑦ 收 chunk + 异常轮次保护</text>
  <text x="76" y="456" fill="#94a3b8" font-size="8.5" font-family="sans-serif">chunk[0] 与 state 偏差 &gt; max-delta0-warn → 跳过本轮</text>

  <!-- L5 安全 -->
  <rect x="60" y="490" width="360" height="52" rx="7" fill="rgba(69,26,3,0.5)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="76" y="511" fill="white" font-size="11" font-weight="600" font-family="sans-serif">⑧ 安全层（MotorExecutor）</text>
  <text x="76" y="528" fill="#94a3b8" font-size="8.5" font-family="sans-serif">限位 0.1° + 单步限速 max_joint_delta + 10s 超时熔断</text>

  <!-- L6 电机 -->
  <rect x="60" y="562" width="360" height="52" rx="7" fill="rgba(2,44,34,0.55)" stroke="#34d399" stroke-width="1.5"/>
  <text x="76" y="583" fill="white" font-size="11" font-weight="600" font-family="sans-serif">⑨ 逐步下发 GeminiFollower</text>
  <text x="76" y="600" fill="#94a3b8" font-size="8.5" font-family="sans-serif">50 步 × step-delay 50ms = 2.5s ｜ 双臂串口</text>

  <!-- arrows: left column vertical -->
  <line x1="240" y1="182" x2="240" y2="200" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <line x1="240" y1="254" x2="240" y2="272" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <line x1="240" y1="470" x2="240" y2="488" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a-cyan)"/>
  <line x1="240" y1="542" x2="240" y2="560" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#a-amber)"/>

  <!-- arrows: request out -->
  <line x1="420" y1="300" x2="578" y2="300" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#a-cyan)"/>
  <text x="499" y="292" fill="#22d3ee" font-size="8.5" text-anchor="middle" font-family="sans-serif">POST /v1/infer</text>
  <text x="499" y="316" fill="#64748b" font-size="8" text-anchor="middle" font-family="sans-serif">≈152KB ↑</text>

  <!-- arrows: cloud vertical -->
  <line x1="760" y1="326" x2="760" y2="344" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a-violet)"/>
  <line x1="760" y1="398" x2="760" y2="416" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a-violet)"/>

  <!-- arrows: response back -->
  <line x1="578" y1="444" x2="422" y2="444" stroke="#a78bfa" stroke-width="1.8" marker-end="url(#a-violet)"/>
  <text x="500" y="436" fill="#a78bfa" font-size="8.5" text-anchor="middle" font-family="sans-serif">200 OK · 50×14</text>
  <text x="500" y="460" fill="#64748b" font-size="8" text-anchor="middle" font-family="sans-serif">≈3KB ↓</text>

  <!-- loop back -->
  <path d="M 240 614 L 240 646 L 30 646 L 30 156 L 58 156" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a-cyan)"/>
  <text x="44" y="400" fill="#64748b" font-size="9" font-family="sans-serif" transform="rotate(-90 44 400)" text-anchor="middle">下一轮（严格串行，无重叠）</text>

  <!-- ============ Panel B: timing ============ -->
  <line x1="30" y1="672" x2="970" y2="672" stroke="#1e293b" stroke-width="1"/>

  <text x="30" y="702" fill="white" font-size="12" font-weight="700" font-family="sans-serif">单轮时序（实测轮周期 3.67s ≈ 0.27 Hz）</text>
  <text x="970" y="702" fill="#64748b" font-size="9" text-anchor="end" font-family="sans-serif">数据来源：云端 10 次请求时间戳 17:44:09→17:44:42 + 服务端处理日志</text>

  <!-- timeline bar: x 90..930 = 840px for 3.67s -->
  <rect x="90" y="740" width="68.7" height="44" fill="rgba(8,51,68,0.85)" stroke="#22d3ee" stroke-width="1.2"/>
  <rect x="158.7" y="740" width="192.3" height="44" fill="rgba(46,16,101,0.85)" stroke="#a78bfa" stroke-width="1.2"/>
  <rect x="351" y="740" width="572.3" height="44" fill="rgba(2,44,34,0.85)" stroke="#34d399" stroke-width="1.2"/>
  <rect x="923.3" y="740" width="6.9" height="44" fill="rgba(69,26,3,0.9)" stroke="#fbbf24" stroke-width="1.2"/>

  <text x="255" y="768" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="sans-serif">推理 + 网络往返</text>
  <text x="637" y="768" fill="white" font-size="12" font-weight="600" text-anchor="middle" font-family="sans-serif">执行 50 步 × 50ms = 2.50s</text>

  <!-- tick boundaries -->
  <line x1="90" y1="732" x2="90" y2="792" stroke="#475569" stroke-width="1"/>
  <line x1="158.7" y1="732" x2="158.7" y2="792" stroke="#475569" stroke-width="1"/>
  <line x1="351" y1="732" x2="351" y2="792" stroke="#475569" stroke-width="1"/>
  <line x1="923.3" y1="732" x2="923.3" y2="792" stroke="#475569" stroke-width="1"/>
  <line x1="930.2" y1="732" x2="930.2" y2="792" stroke="#475569" stroke-width="1"/>

  <!-- time axis -->
  <text x="90" y="806" fill="#64748b" font-size="8" text-anchor="middle" font-family="sans-serif">0.00s</text>
  <text x="158.7" y="806" fill="#64748b" font-size="8" text-anchor="middle" font-family="sans-serif">0.30s</text>
  <text x="351" y="806" fill="#64748b" font-size="8" text-anchor="middle" font-family="sans-serif">1.14s</text>
  <text x="923" y="806" fill="#64748b" font-size="8" text-anchor="end" font-family="sans-serif">3.64s</text>
  <text x="930" y="806" fill="#64748b" font-size="8" text-anchor="start" font-family="sans-serif"> 3.67s</text>

  <!-- legend -->
  <rect x="90" y="826" width="12" height="12" fill="rgba(8,51,68,0.85)" stroke="#22d3ee" stroke-width="1"/>
  <text x="110" y="836" fill="#cbd5e1" font-size="9" font-family="sans-serif">采集 3 路相机 + JPEG 编码 ≈0.30s（估算）</text>
  <rect x="90" y="848" width="12" height="12" fill="rgba(46,16,101,0.85)" stroke="#a78bfa" stroke-width="1"/>
  <text x="110" y="858" fill="#cbd5e1" font-size="9" font-family="sans-serif">推理往返 ≈0.84s（实测均值）= 云端计算 0.26s + 网络 ≈0.58s</text>
  <rect x="520" y="826" width="12" height="12" fill="rgba(2,44,34,0.85)" stroke="#34d399" stroke-width="1"/>
  <text x="540" y="836" fill="#cbd5e1" font-size="9" font-family="sans-serif">执行 50 步 = 2.50s（标称 50 × 50ms）</text>
  <rect x="520" y="848" width="12" height="12" fill="rgba(69,26,3,0.9)" stroke="#fbbf24" stroke-width="1"/>
  <text x="540" y="858" fill="#cbd5e1" font-size="9" font-family="sans-serif">读状态 / 日志 / 统计 ≈0.03s</text>

  <!-- 10 rounds strip -->
  <text x="30" y="890" fill="white" font-size="10" font-weight="600" font-family="sans-serif">连续 10 轮 = 36.7s（每轮严格串行）</text>
  <g stroke="#334155" stroke-width="1">
    <rect x="90"    y="898" width="84" height="26" fill="rgba(15,23,42,0.9)"/>
    <rect x="174"   y="898" width="84" height="26" fill="rgba(15,23,42,0.9)"/>
    <rect x="258"   y="898" width="84" height="26" fill="rgba(15,23,42,0.9)"/>
    <rect x="342"   y="898" width="84" height="26" fill="rgba(15,23,42,0.9)"/>
    <rect x="426"   y="898" width="84" height="26" fill="rgba(15,23,42,0.9)"/>
    <rect x="510"   y="898" width="84" height="26" fill="rgba(15,23,42,0.9)"/>
    <rect x="594"   y="898" width="84" height="26" fill="rgba(15,23,42,0.9)"/>
    <rect x="678"   y="898" width="84" height="26" fill="rgba(15,23,42,0.9)"/>
    <rect x="762"   y="898" width="84" height="26" fill="rgba(15,23,42,0.9)"/>
    <rect x="846"   y="898" width="84" height="26" fill="rgba(15,23,42,0.9)"/>
  </g>
  <g fill="#64748b" font-size="8" text-anchor="middle" font-family="sans-serif">
    <text x="132" y="915">R1</text><text x="216" y="915">R2</text><text x="300" y="915">R3</text>
    <text x="384" y="915">R4</text><text x="468" y="915">R5</text><text x="552" y="915">R6</text>
    <text x="636" y="915">R7</text><text x="720" y="915">R8</text><text x="804" y="915">R9</text>
    <text x="888" y="915">R10</text>
  </g>

  <!-- warning note -->
  <rect x="30" y="944" width="940" height="46" rx="6" fill="rgba(76,5,25,0.55)" stroke="#fb7185" stroke-width="1.2"/>
  <text x="46" y="964" fill="#fda4af" font-size="10" font-weight="600" font-family="sans-serif">⚠ 时序脆弱点：超时熔断阈值 10s 由「上一步 → 下一步」的间隔决定。</text>
  <text x="46" y="981" fill="#94a3b8" font-size="9" font-family="sans-serif">两跳 SSH 隧道曾把单轮延迟顶到 14925ms 触发熔断（60 轮中 12 轮整轮被跳过）；改 NUC 直连云端后最大 1306ms、熔断 0 次。</text>
</svg>

# SmolVLA training — storage-optimized (single checkpoint, no eval overhead)
seed: 1000
batch_size: 8
steps: 5000
save_freq: 5000        # only save at the end (1 checkpoint)
log_freq: 50
num_workers: 4
output_dir: /workspace/vla-course/outputs/smolvla_v1
job_name: smolvla_v1
resume: false
save_checkpoint: true
env_eval_freq: -1       # disable evaluation during training
use_policy_training_preset: true

dataset:
  repo_id: datawhale_eai_pnp_language
  root: /tmp/demo_data_language
  image_transforms:
    enable: true
    max_num_transforms: 2
    random_order: false
    tfs:
      brightness:
        weight: 1.0
        type: ColorJitter
        kwargs:
          brightness: [0.8, 1.2]
      contrast:
        weight: 1.0
        type: ColorJitter
        kwargs:
          contrast: [0.8, 1.2]

policy:
  type: smolvla
  push_to_hub: false
  n_obs_steps: 1
  chunk_size: 50
  n_action_steps: 50
  device: cuda
  use_amp: false
  freeze_vision_encoder: true
  train_expert_only: true
  train_state_proj: true
  num_vlm_layers: 16
  self_attn_every_n_layers: 2
  expert_width_multiplier: 0.75
  vlm_model_name: HuggingFaceTB/SmolVLM2-500M-Video-Instruct
  attention_mode: cross_attn

optimizer:
  type: adamw
  lr: 0.0001
  weight_decay: 1.0e-10
  grad_clip_norm: 10.0
  betas: [0.9, 0.95]
  eps: 1.0e-08

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 500
  num_decay_steps: 5000
  peak_lr: 0.0001
  decay_lr: 2.5e-06
